# gh's settings. Only the alias is worth carrying between Macs; gh falls back
# to its own default for every key that is missing here.
#
# The neighbouring hosts.yml holds the OAuth token and is never managed: this
# repo is public, and the GitHub script logs each machine in on its own.
aliases:
    co: pr checkout
# gh's config-schema marker, written exactly as gh writes it. Any gh command
# appends it to a file that lacks it, and the rewrite would stop every later
# apply at "has changed since chezmoi last wrote it?". With it here the file is
# byte-identical to what gh leaves behind, so an apply stays quiet.
version: "1"
